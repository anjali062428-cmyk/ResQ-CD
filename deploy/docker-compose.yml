services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/active:/etc/nginx/active
    networks:
      - resqcd-net
    restart: unless-stopped

networks:
  resqcd-net:
    external: true
