services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/active:/etc/nginx/active
    networks:
      - resqcd-net
    restart: unless-stopped

  dashboard:
    image: nginx:alpine
    container_name: dashboard
    ports:
      - "8081:80"
    volumes:
      - ../dashboard:/usr/share/nginx/html
      - ./state:/usr/share/nginx/html/state:ro
    networks:
      - resqcd-net
    restart: unless-stopped

networks:
  resqcd-net:
    external: true
