<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResQ-CD</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --surface: #fff;
      --line: #d8dee4;
      --text: #1f2328;
      --mute: #656d76;
      --ok: #1a7f37;
      --ok-bg: #dafbe1;
      --bad: #cf222e;
      --bad-bg: #ffebe9;
      --blue: #0969da;
      --green: #1a7f37;
      --hover: #f3f4f6;
      --bar: #8c959f;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #0d1117;
        --surface: #151b23;
        --line: #30363d;
        --text: #e6edf3;
        --mute: #8b949e;
        --ok: #3fb950;
        --ok-bg: #12261e;
        --bad: #f85149;
        --bad-bg: #2d1618;
        --blue: #4493f8;
        --green: #3fb950;
        --hover: #1b222c;
        --bar: #6e7681;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 var(--font)
    }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 20px
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line)
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 20px;
      height: 56px
    }

    .brand {
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .mark {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--blue) 50%, var(--green) 50%)
    }

    .sync {
      margin-left: auto;
      color: var(--mute);
      font-size: 12.5px;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok)
    }

    .dot.off {
      background: var(--bad)
    }

    nav {
      display: flex;
      gap: 4px;
      overflow-x: auto
    }

    nav a {
      color: var(--mute);
      text-decoration: none;
      padding: 14px 12px;
      border-bottom: 2px solid transparent;
      white-space: nowrap
    }

    nav a:hover {
      color: var(--text)
    }

    nav a[aria-current=page] {
      color: var(--text);
      font-weight: 600;
      border-color: var(--blue)
    }

    nav a:focus-visible,
    select:focus-visible,
    a.row:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: -2px
    }

    main {
      padding: 24px 0 48px
    }

    .status {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--ok);
      border-radius: 6px;
      background: var(--surface);
      margin-bottom: 16px
    }

    .status.bad {
      border-left-color: var(--bad)
    }

    .status h2 {
      font-size: 15px;
      font-weight: 600
    }

    .status p {
      color: var(--mute);
      margin-top: 2px
    }

    .box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 16px;
      overflow: hidden
    }

    .box>h3 {
      font-size: 14px;
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .box>h3 a {
      font-weight: 400;
      font-size: 13px;
      color: var(--blue);
      text-decoration: none
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr)
    }

    .stats div {
      padding: 14px 16px;
      border-right: 1px solid var(--line)
    }

    .stats div:last-child {
      border: 0
    }

    .stats span {
      color: var(--mute);
      font-size: 12.5px;
      display: block
    }

    .stats b {
      font: 600 22px/1.3 var(--font)
    }

    .chartwrap {
      padding: 12px 16px 8px
    }

    svg {
      width: 100%;
      display: block
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-top: 1px solid var(--line);
      color: inherit;
      text-decoration: none
    }

    .row:first-of-type {
      border-top: 0
    }

    .row:hover {
      background: var(--hover)
    }

    .ico {
      flex: 0 0 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: var(--ok)
    }

    .ico.bad {
      background: var(--bad)
    }

    .rt {
      flex: 1;
      min-width: 0
    }

    .rt b {
      font-weight: 600
    }

    .rt small {
      display: block;
      color: var(--mute);
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .meta {
      color: var(--mute);
      font-size: 12.5px;
      text-align: right;
      white-space: nowrap
    }

    .meta .mono {
      font-family: var(--mono)
    }

    .tag {
      font-size: 11.5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 8px;
      color: var(--mute)
    }

    .sw {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 6px
    }

    .sw.blue {
      background: var(--blue)
    }

    .sw.green {
      background: var(--green)
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px
    }

    .toolbar h2 {
      font-size: 18px;
      font-weight: 600
    }

    select {
      font: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 10px
    }

    .envs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .env {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 18px
    }

    .env.live {
      border-color: var(--ok)
    }

    .env h4 {
      font-size: 15px;
      font-weight: 600;
      text-transform: capitalize;
      display: flex;
      align-items: center;
      margin-bottom: 10px
    }

    .env h4 .tag {
      margin-left: auto;
      text-transform: none
    }

    .env.live .tag {
      color: var(--ok);
      border-color: var(--ok);
      background: var(--ok-bg)
    }

    .env dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 14px;
      font-size: 13px
    }

    .env dt {
      color: var(--mute)
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--mute)
    }

    [hidden] {
      display: none !important
    }

    @media(max-width:720px) {
      .wrap {
        padding: 0 14px
      }

      .bar {
        height: 50px
      }

      .stats {
        grid-template-columns: 1fr 1fr
      }

      .stats div:nth-child(2) {
        border-right: 0
      }

      .stats div:nth-child(-n+2) {
        border-bottom: 1px solid var(--line)
      }

      .envs {
        grid-template-columns: 1fr
      }

      .row {
        flex-wrap: wrap
      }

      .rt small {
        white-space: normal
      }

      .meta {
        width: 100%;
        text-align: left;
        padding-left: 34px;
        display: flex;
        gap: 10px
      }

      .meta br {
        display: none
      }

      .sync span:last-child {
        display: none
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="bar">
        <div class="brand"><span class="mark"></span>ResQ-CD</div>
        <div class="sync" title="Auto-refreshes every 5 seconds"><span class="dot" id="dot"></span><span
            id="sync">Connecting</span></div>
      </div>
      <nav aria-label="Sections">
        <a href="#overview" data-t="overview">Overview</a>
        <a href="#history" data-t="history">Release history</a>
        <a href="#environments" data-t="environments">Environments</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="t-overview">
      <div class="status" id="status"></div>
      <div class="box stats">
        <div><span>Releases</span><b id="sTotal">0</b></div>
        <div><span>Success rate</span><b id="sRate">0%</b></div>
        <div><span>Blocked before traffic</span><b id="sBad">0</b></div>
        <div><span>Avg deploy time</span><b id="sAvg">0s</b></div>
      </div>
      <div class="box">
        <h3>Deploy time, last 12 releases</h3>
        <div class="chartwrap"><svg id="chart" role="img" aria-label="Bar chart of deploy time per release"></svg></div>
      </div>
      <div class="box">
        <h3>Latest releases <a href="#history">View all</a></h3>
        <div id="recent"></div>
      </div>
    </section>

    <section id="t-history" hidden>
      <div class="toolbar">
        <h2>Release history</h2>
        <label><span style="color:var(--mute);font-size:13px">Show </span>
          <select id="filter" aria-label="Filter releases">
            <option value="all">All</option>
            <option value="ok">Deployed</option>
            <option value="bad">Blocked</option>
          </select></label>
      </div>
      <div class="box" id="hist"></div>
    </section>

    <section id="t-environments" hidden>
      <div class="toolbar">
        <h2>Environments</h2>
      </div>
      <div class="envs" id="envs"></div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id), HIST = "/state/history.json", LIVE = "http://localhost:8080/api/version";
    let data = [], liveV = null;
    const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
    const okS = r => r.status === "SUCCESS";
    const lab = r => okS(r) ? "Deployed" : r.status === "ROLLED_BACK" ? "Rolled back" : "Blocked at health check";
    const ago = t => { const s = (Date.now() - new Date(t)) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + " min ago" : s < 86400 ? Math.floor(s / 3600) + " h ago" : Math.floor(s / 86400) + " d ago" };
    const prev = i => { for (let j = i + 1; j < data.length; j++)if (okS(data[j])) return data[j].version; return null };
    const note = (r, i) => okS(r) ? `Switched to ${esc(r.color)}, old environment removed` : `${r.status === "ROLLED_BACK" ? "Failed after switch, rolled back" : "Never received traffic"}${prev(i) ? `. Still serving ${esc(prev(i))}` : ""}`;
    const row = (r, i) => `<div class="row"><span class="ico ${okS(r) ? "" : "bad"}" aria-hidden="true">${okS(r) ? "&#10003;" : "&#10005;"}</span>
 <div class="rt"><b>Release ${esc(r.version)}</b> <span class="tag">${esc(r.color)}</span><small>${lab(r)}. ${note(r, i)}</small></div>
 <div class="meta"><span class="mono">${r.duration_sec}s</span><br>${ago(r.timestamp)}</div></div>`;

    function chart() {
      const pts = [...data].reverse().slice(-12), svg = $("chart");
      if (!pts.length) { svg.innerHTML = ""; return }
      const W = Math.max(300, Math.round(svg.getBoundingClientRect().width)), H = 200, L = 34, B = 24, T = 8, R = 4;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.style.height = H + "px";
      const top = Math.max(10, Math.ceil(Math.max(...pts.map(p => +p.duration_sec || 0)) / 10) * 10), y = v => T + (H - T - B) * (1 - v / top);
      const cs = getComputedStyle(document.documentElement), c = n => cs.getPropertyValue(n).trim();
      const bw = (W - L - R) / pts.length, w = Math.min(36, bw * .6);
      let g = ""; for (let k = 0; k <= 2; k++) { const v = top * k / 2; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${c("--line")}"/><text x="${L - 6}" y="${y(v) + 4}" fill="${c("--mute")}" font-size="11" text-anchor="end">${Math.round(v)}s</text>` }
      const stp = Math.ceil(pts.length / Math.max(2, Math.floor((W - L - R) / 44)));
      const bars = pts.map((p, i) => {
        const x = L + i * bw + (bw - w) / 2, h = y(0) - y(p.duration_sec);
        return `<rect x="${x}" y="${y(p.duration_sec)}" width="${w}" height="${h}" rx="2" fill="${okS(p) ? c("--ok") : c("--bad")}"><title>Release ${esc(p.version)}: ${p.duration_sec}s, ${lab(p)}</title></rect>` +
          ((i % stp === 0 || i === pts.length - 1) ? `<text x="${x + w / 2}" y="${H - 7}" fill="${c("--mute")}" font-size="11" text-anchor="middle">${esc(p.version)}</text>` : "")
      }).join("");
      svg.innerHTML = g + bars;
    }

    function render() {
      const n = data.length, bad = data.filter(r => !okS(r)).length, live = data.find(okS), v = liveV || (live && live.version), l = data[0];
      $("sTotal").textContent = n; $("sRate").textContent = n ? Math.round((n - bad) / n * 100) + "%" : "–";
      $("sBad").textContent = bad; $("sAvg").textContent = n ? Math.round(data.reduce((a, r) => a + (+r.duration_sec || 0), 0) / n) + "s" : "–";
      const st = $("status");
      if (!n) { st.className = "status"; st.innerHTML = "<div><h2>No releases yet</h2><p>Run the Jenkins pipeline to create the first one.</p></div>" }
      else if (!okS(l)) { st.className = "status bad"; st.innerHTML = `<div><h2>Release ${esc(l.version)} was blocked. Production is unaffected.</h2><p>${live ? `Still serving release ${esc(v)} on ${esc(live.color)}. ` : ""}${lab(l)}, ${ago(l.timestamp)}.</p></div>` }
      else { st.className = "status"; st.innerHTML = `<div><h2>Production is serving release ${esc(v)} on ${esc(l.color)}</h2><p>Deployed ${ago(l.timestamp)} in ${l.duration_sec}s. All health checks passed.</p></div>` }
      chart();
      $("recent").innerHTML = n ? data.slice(0, 5).map(row).join("") : `<div class="empty">Nothing to show yet.</div>`;
      const f = $("filter").value, list = data.map((r, i) => [r, i]).filter(([r]) => f === "all" || (f === "ok") === okS(r));
      $("hist").innerHTML = list.length ? list.map(([r, i]) => row(r, i)).join("") : `<div class="empty">No releases match this filter.</div>`;
      $("envs").innerHTML = ["blue", "green"].map(col => {
        const isLive = live && live.color === col, last = data.find(r => r.color === col);
        return `<div class="env ${isLive ? "live" : ""}"><h4><span class="sw ${col}"></span>${col}<span class="tag">${isLive ? "Live" : "Idle"}</span></h4><dl>
    <dt>Serving</dt><dd>${isLive ? "Release " + esc(v) : "No traffic"}</dd>
    <dt>Last run</dt><dd>${last ? `Release ${esc(last.version)}, ${lab(last).toLowerCase()}` : "None"}</dd>
    <dt>When</dt><dd>${last ? ago(last.timestamp) : "–"}</dd></dl></div>`
      }).join("");
    }

    function route() {
      const t = ["overview", "history", "environments"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview";
      ["overview", "history", "environments"].forEach(x => $("t-" + x).hidden = x !== t);
      document.querySelectorAll("nav a").forEach(a => a.toggleAttribute("aria-current", a.dataset.t === t) || a.removeAttribute("aria-current"));
      document.querySelectorAll("nav a").forEach(a => { if (a.dataset.t === t) a.setAttribute("aria-current", "page") });
      if (t === "overview") chart();
    }
    async function load() {
      try {
        const r = await fetch(HIST + "?t=" + Date.now(), { cache: "no-store" });
        data = (await r.json()).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        $("dot").classList.remove("off"); $("sync").textContent = "Updated " + new Date().toLocaleTimeString();
      } catch (e) { $("dot").classList.add("off"); $("sync").textContent = "Cannot read history" }
      try { const v = (await (await fetch(LIVE, { cache: "no-store" })).text()).trim(); liveV = v && v.length < 20 ? v : null } catch (e) { liveV = null }
      render();
    }
    $("filter").onchange = render;
    window.addEventListener("hashchange", route); window.addEventListener("resize", () => { if (!$("t-overview").hidden) chart() });
    route(); load(); setInterval(load, 5000);
  </script>
</body>

</html>
